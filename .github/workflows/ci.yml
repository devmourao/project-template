name: CI - Qualidade e Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Verificar Lint e Tipagem
        run: npm run lint && npx tsc --noEmit

      - name: Executar Testes
        run: npm test --if-present

      - name: Testar Build de Produção
        run: npm run build
